<rect x="660" y="134" width="210" height="8" rx="4" fill="#2a3744"/><rect x="660" y="134" width="140" height="8" rx="4" fill="#4a90c2"/><text x="660" y="160" fill="#6f8294">小目標 4／6</text>
<rect x="646" y="184" width="238" height="96" rx="10" fill="#1c2733"/><text x="660" y="206" fill="#e6edf3" font-weight="600">範例專案 B　P2</text><text x="660" y="226" fill="#b6c4d1">現在：整理文件</text>
<rect x="660" y="242" width="210" height="8" rx="4" fill="#2a3744"/><rect x="660" y="242" width="70" height="8" rx="4" fill="#6fae7b"/><text x="660" y="268" fill="#6f8294">小目標 1／3</text>
<rect x="646" y="292" width="238" height="70" rx="10" fill="#1c2733" opacity=".6"/><text x="660" y="314" fill="#e6edf3" font-weight="600">範例專案 C　P5 暫停</text><text x="660" y="336" fill="#6f8294">現在：暫停中</text>
<rect x="646" y="376" width="238" height="60" rx="10" fill="#2e2518" stroke="#c28a4a"/><text x="660" y="398" fill="#c28a4a">認領中</text><text x="660" y="418" fill="#e6edf3">示範主機：codex 正在動</text></g>
