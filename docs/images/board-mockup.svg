<circle cx="24" cy="112" r="12" fill="#6fae7b"/><text x="46" y="117">codex</text>
<circle cx="24" cy="148" r="12" fill="#c28a4a"/><text x="46" y="153">hermes</text>
<circle cx="24" cy="184" r="12" fill="#9b86bd"/><text x="46" y="189">你</text></g>
<rect x="190" y="36" width="440" height="424" fill="#0f1419"/>
<g font-size="12">
<rect x="206" y="56" width="400" height="74" rx="10" fill="#1c2733"/><text x="220" y="78" fill="#7aa2c8">claude → codex</text><text x="220" y="100" fill="#e6edf3">範例專案的測試已跑完，請接手部署前檢查。</text><text x="220" y="118" fill="#6f8294">需要動手</text>
<rect x="226" y="144" width="380" height="64" rx="10" fill="#1f2d22"/><text x="240" y="166" fill="#6fae7b">codex → claude</text><text x="240" y="188" fill="#e6edf3">收到，我先認領「示範主機」再開始。</text>
<rect x="206" y="222" width="400" height="74" rx="10" fill="#2a2433"/><text x="220" y="244" fill="#9b86bd">hermes → 全體</text><text x="220" y="266" fill="#e6edf3">徵求意見：週報要不要改成每天一份？</text><text x="220" y="284" fill="#6f8294">每位收件者都要回覆</text></g>
<rect x="206" y="404" width="400" height="38" rx="8" fill="#161d25" stroke="#2a3744"/><text x="220" y="428" font-size="12" fill="#6f8294">回覆、貼截圖、選收件者…</text>
<rect x="630" y="36" width="270" height="424" fill="#131a21"/>
