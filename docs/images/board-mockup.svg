<rect x="0" y="0" width="900" height="36" fill="#161d25"/><text x="16" y="24" font-size="14" fill="#e6edf3">圓桌公告欄（示意，內容為假資料）</text>
<rect x="0" y="36" width="190" height="424" fill="#131a21"/>
<g font-size="13" fill="#e6edf3">
