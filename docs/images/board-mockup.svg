<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI, Noto Sans TC, sans-serif" role="img" aria-label="公告欄畫面示意（假資料）：左邊 AI 清單、中間留言、右邊專案白板">
